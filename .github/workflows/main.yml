name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Backend: Lint"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  test:
    name: "Backend: Test"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        plone-version: ['6.2-latest', '6.1-latest', '6.0-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}

  install-configurations:
    name: "Backend: Install configurations"
    needs:
      - config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The optional dependencies are extras, and their absence is a
        # supported state that changes behaviour -- without the captcha the
        # form is deliberately not offered to anonymous users, and without
        # collective.fingerpointing nothing is audit logged. All four
        # combinations are therefore exercised.
        extras:
          - ""
          - "captcha"
          - "audit"
          - "all"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the add-on
        run: |
          set -euo pipefail
          EXTRAS="test"
          if [ -n "${{ matrix.extras }}" ]; then
            EXTRAS="test,${{ matrix.extras }}"
          fi
          echo "::notice::Installing .[${EXTRAS}]"
          curl -sSfL -o constraints-ci.txt \
            "https://dist.plone.org/release/${{ needs.config.outputs.plone-version }}/constraints.txt"
          uv venv --python "${{ needs.config.outputs.python-version }}" .venv
          VIRTUAL_ENV=.venv uv pip install -c constraints-ci.txt -e ".[${EXTRAS}]"

      - name: Report what is installed
        run: |
          .venv/bin/python -c "
          import importlib.util as u
          for name in ('plone.formwidget.hcaptcha', 'collective.fingerpointing'):
              print(name, 'PRESENT' if u.find_spec(name) else 'ABSENT')
          "

      - name: Run tests
        run: .venv/bin/pytest -q

  coverage:
    name: "Backend: Test Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    needs:
      - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - install-configurations
      - coverage
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Install configurations | ${{ needs.install-configurations.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY