[project]
name = "imio.reportproblem"
dynamic = ["version"]
description = "Report a problem on Plone content: adds a report button that emails the report to configured recipients"
readme = "README.md"
license = "GPL-2.0-only"
# Upper bound on purpose: the classifiers, the CI matrix and Plone itself stop
# at 3.13, and an open ">=3.10" claims 3.14 support that is neither tested nor
# real (check-python-versions flags exactly that).
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Antoine Duchêne", email = "antoine.duchene@imio.be" },
]
keywords = [
    "CMS",
    "Plone",
    "Python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.0",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Products.CMFPlone",
    "plone.api",
    
    "z3c.jbot",
]

[project.optional-dependencies]
captcha = [
    "plone.formwidget.hcaptcha",
]
audit = [
    "collective.fingerpointing",
]
all = [
    "imio.reportproblem[audit,captcha]",
]
test = [
    "horse-with-no-namespace",
    "plone.app.testing",
    "plone.classicui","plone.restapi[test]",
    "pytest",
    "pytest-cov",
    "pytest-plone>=1.0.0a2",
]
release = [
    "zest.releaser[recommended]",
    "zestreleaser.towncrier",
    "zest.pocompile",
]

[project.urls]
Homepage = "https://github.com/IMIO/imio.reportproblem"
PyPI = "https://pypi.org/project/imio.reportproblem"
Source = "https://github.com/IMIO/imio.reportproblem"
Tracker = "https://github.com/IMIO/imio.reportproblem/issues"


[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[build-system]
# setuptools rather than the hatchling the cookieplone template ships:
# zc.buildout's ``develop`` runs ``setup.py`` directly, so a PEP 517 only
# package cannot be a develop egg in the iMio buildouts. The metadata still
# lives here, in PEP 621 form, and setup.py is a bare shim.
requires = ["setuptools>=68.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# Single source of truth, and the file [tool.zest-releaser] already bumps.
version = {attr = "imio.reportproblem.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420: the ``imio`` namespace has no __init__.py on purpose.
namespaces = true

[tool.setuptools.package-data]
# ZCML, GenericSetup XML, page templates and the compiled catalogs all have to
# ship, or the add-on installs into a site and does nothing.
"*" = [
    "*.zcml",
    "*.xml",
    "*.pt",
    "*.pot",
    "*.po",
    "*.mo",
    "*.txt",
    "*.css",
    "*.js",
]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/IMIO/imio.reportproblem/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["imio.reportproblem", "tests"]
branch = true
parallel = true
omit = [
  "src/imio/reportproblem/locales/*.py",
]

[tool.zest-releaser]
python-file-with-version = "src/imio/reportproblem/__init__.py"
